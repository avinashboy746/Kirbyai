<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirby AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #161f30;
            --accent-color: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00c6ff 0%, #00f2fe 100%);
            --text-color: #e2e8f0;
            --text-dim: #94a3b8;
            --bot-msg: #1e293b;
            --user-msg: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar Header */
        header {
            background: var(--panel-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand {
            font-size: 1.2rem;
            font-weight: bold;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .model-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 8px;
            outline: none;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        /* API Settings Bar */
        .api-bar {
            background: #0f172a;
            padding: 8px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .api-bar input {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            color: var(--text-color);
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
        }

        /* Chat Window */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bot-msg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom-left-radius: 2px;
        }

        .message img {
            max-width: 240px;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        .msg-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
        }

        .speak-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .speak-btn:hover {
            color: var(--accent-color);
        }

        /* Input Control Panel */
        .input-container {
            background: var(--panel-bg);
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preview-area {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .preview-area img {
            height: 45px;
            border-radius: 6px;
        }

        .remove-img {
            color: #ef4444;
            cursor: pointer;
        }

        .input-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-box textarea {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 10px;
            resize: none;
            height: 44px;
            outline: none;
            font-size: 0.9rem;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-color);
            width: 42px;
            height: 42px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .icon-btn.recording {
            background: #ef4444;
        }

        .send-btn {
            background: var(--accent-gradient);
            color: #000;
            font-weight: bold;
        }

        .privacy-note {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <i class="fa-solid fa-robot"></i> Kirby AI
        </div>
        <div class="header-controls">
            <!-- Custom Model Switcher (Hidden Real Names) -->
            <select id="modelSelector" class="model-select">
                <option value="gemini-1.5-flash">Kirby AI Standard (Fast)</option>
                <option value="gemini-1.5-pro">Kirby AI Pro (Advanced)</option>
            </select>
            <button class="btn" onclick="startNewChat()"><i class="fa-solid fa-plus"></i> New Chat</button>
        </div>
    </header>

    <!-- API Key Input Bar -->
    <div class="api-bar">
        <i class="fa-solid fa-key" style="color: var(--accent-color);"></i>
        <input type="password" id="apiKeyInput" placeholder="Enter API Key to start chatting..." onchange="saveApiKey()">
    </div>

    <!-- Main Chat Window -->
    <div class="chat-container" id="chatContainer"></div>

    <!-- Bottom Input Controls -->
    <div class="input-container">
        <div class="preview-area" id="previewArea" style="display: none;">
            <img id="imagePreview" src="" alt="Preview">
            <i class="fa-solid fa-xmark remove-img" onclick="removeImage()"></i>
        </div>
        <div class="input-box">
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            <button class="icon-btn" onclick="document.getElementById('imageInput').click()" title="Attach Image">
                <i class="fa-solid fa-image"></i>
            </button>
            <button class="icon-btn" id="micBtn" onclick="toggleVoiceInput()" title="Voice Input">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <textarea id="userInput" placeholder="Ask Kirby AI..." onkeydown="handleKeyPress(event)"></textarea>
            <button class="icon-btn send-btn" onclick="sendMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
        <div class="privacy-note">
            🔒 Private Session Active • Messages stored locally in browser
        </div>
    </div>

    <script>
        let currentImageBase64 = null;
        let recognition = null;
        let isRecording = false;

        window.onload = () => {
            const savedKey = localStorage.getItem('kirby_api_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            
            loadChatHistory();
            setupSpeechRecognition();
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('kirby_api_key', key);
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    currentImageBase64 = evt.target.result.split(',')[1];
                    document.getElementById('imagePreview').src = evt.target.result;
                    document.getElementById('previewArea').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            currentImageBase64 = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('previewArea').style.display = 'none';
        }

        function setupSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'hi-IN';

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('userInput').value += ' ' + transcript;
                    stopRecording();
                };

                recognition.onerror = stopRecording;
                recognition.onend = stopRecording;
            }
        }

        function toggleVoiceInput() {
            if (!recognition) return alert("Speech recognition not supported on this browser.");
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
            }
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            }
        }

        function appendMessage(role, text, imgSrc = null) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            let content = `<div>${text}</div>`;
            if (imgSrc) content = `<img src="${imgSrc}">${content}`;

            if (role === 'bot') {
                content += `
                    <div class="msg-footer">
                        <button class="speak-btn" onclick="speakText(\`${text.replace(/`/g, "\\`").replace(/'/g, "\\'")}\`)">
                            <i class="fa-solid fa-volume-high"></i> Listen
                        </button>
                    </div>`;
            }

            msgDiv.innerHTML = content;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function saveMessageToStorage(role, text, imgSrc = null) {
            const history = JSON.parse(localStorage.getItem('kirby_chats') || '[]');
            history.push({ role, text, imgSrc });
            localStorage.setItem('kirby_chats', JSON.stringify(history));
        }

        function loadChatHistory() {
            const history = JSON.parse(localStorage.getItem('kirby_chats') || '[]');
            if (history.length === 0) {
                appendMessage('bot', 'Namaste! Main **Kirby AI** hoon. Main aapki kya madad kar sakta hoon?');
            } else {
                history.forEach(msg => appendMessage(msg.role, msg.text, msg.imgSrc));
            }
        }

        function startNewChat() {
            localStorage.removeItem('kirby_chats');
            document.getElementById('chatContainer').innerHTML = '';
            appendMessage('bot', 'Nayi chat start ho gayi hai! Kirby AI aapki kya madad kare?');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const apiKey = localStorage.getItem('AQ.Ab8RN6IQVWLvKICzULnRfJUhq0JimSYxAPUZ8r7FysfQAqaREw');
            if (!apiKey) return alert("Pehle API Key dalein!");

            const inputEl = document.getElementById('userInput');
            const prompt = inputEl.value.trim();
            if (!prompt && !currentImageBase64) return;

            const selectedModel = document.getElementById('modelSelector').value;
            const imageSrcForUI = currentImageBase64 ? `data:image/jpeg;base64,${currentImageBase64}` : null;
            
            appendMessage('user', prompt, imageSrcForUI);
            saveMessageToStorage('user', prompt, imageSrcForUI);

            inputEl.value = '';
            const tempImg = currentImageBase64;
            removeImage();

            const parts = [];
            if (prompt) parts.push({ text: prompt });
            if (tempImg) {
                parts.push({
                    inline_data: { mime_type: "image/jpeg", data: tempImg }
                });
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts }] })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const botReply = data.candidates[0].content.parts[0].text;
                appendMessage('bot', botReply);
                saveMessageToStorage('bot', botReply);

            } catch (err) {
                appendMessage('bot', "Error: " + err.message);
            }
        }
    </script>
</body>
  </html>
